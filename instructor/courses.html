<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - AI Fluency</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../images/logo.svg" alt="Logo">
                <h2>AI Fluency</h2>
            </div>

            <div class="sidebar-profile">
                <div class="profile-avatar">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <div class="profile-name">Instructor</div>
                <div class="profile-role">Instructor</div>
            </div>

            <nav class="sidebar-nav">
                <a href="/instructor/dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/instructor/courses.html" class="nav-item active">
                    <i class="fas fa-book"></i>
                    <span>My Courses</span>
                </a>
                <a href="/instructor/students.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Students</span>
                </a>
                <a href="#" class="nav-item disabled" title="Coming Soon" onclick="return false;">
                    <i class="fas fa-tasks"></i>
                    <span>Assignments</span>
                </a>
                <a href="/instructor/grading.html" class="nav-item">
                    <i class="fas fa-clipboard-check"></i>
                    <span>Grading</span>
                </a>
                <a href="/instructor/analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
                <a href="#" class="nav-item disabled" title="Coming Soon" onclick="return false;">
                    <i class="fas fa-bullhorn"></i>
                    <span>Announcements</span>
                </a>
                <a href="/profile/edit.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <a href="#" onclick="Auth.logout(); return false;" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Top Bar -->
            <div class="dashboard-topbar">
                <div class="topbar-left">
                    <h1>My Courses</h1>
                </div>
                <div class="topbar-right">
                    <div class="topbar-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="course-search" placeholder="Search courses...">
                    </div>
                </div>
            </div>

            <!-- Dashboard Content -->
            <div class="dashboard-content" id="dashboard-content">
                <!-- Course Stats -->
                <div class="dashboard-grid" style="margin-bottom: 2rem;">
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Total Courses</div>
                                <div class="card-value" id="stat-total-courses">0</div>
                            </div>
                            <div class="card-icon blue">
                                <i class="fas fa-book"></i>
                            </div>
                        </div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Total Students</div>
                                <div class="card-value" id="stat-total-students">0</div>
                            </div>
                            <div class="card-icon green">
                                <i class="fas fa-users"></i>
                            </div>
                        </div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Published</div>
                                <div class="card-value" id="stat-published">0</div>
                            </div>
                            <div class="card-icon orange">
                                <i class="fas fa-globe"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Courses List -->
                <div class="dashboard-card">
                    <div id="courses-container">
                        <div class="loading-spinner">Loading courses...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/script.js"></script>
    <script>
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        if (hamburger) {
            hamburger.addEventListener('click', function() {
                sidebar.classList.toggle('mobile-open');
            });
        }
    </script>

    <!-- Authentication System -->
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-template.js"></script>

    <!-- Instructor Courses Module -->
    <script src="../js/instructor-courses.js"></script>

    <!-- Page Protection -->
    <script>
        Auth.requireAuth(['teacher', 'superadmin', 'orgadmin', 'schooladmin']);
    </script>
</body>
</html>
