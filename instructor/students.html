<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VNN90D4GDE"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VNN90D4GDE');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Students - AI Fluency</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <style>
        .students-pager-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem 0 0;
            border-top: 1px solid var(--border-color, #e5e7eb);
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        .pager-summary { color: #6b7280; }
        .pager-buttons { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .pager-btn {
            min-width: 2.25rem;
            padding: 0.4rem 0.65rem;
            background: #fff;
            color: #374151;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .pager-btn:hover:not(:disabled) { background: #f3f4f6; }
        .pager-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .pager-btn.pager-active {
            background: var(--primary-color, #4B6EFB);
            color: #fff;
            border-color: var(--primary-color, #4B6EFB);
        }
        .pager-ellipsis { padding: 0.4rem 0.25rem; color: #9ca3af; }

        .view-toggle {
            display: inline-flex;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
        }
        .view-toggle button {
            background: #fff;
            color: #374151;
            border: 0;
            padding: 0.45rem 0.75rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .view-toggle button + button { border-left: 1px solid #d1d5db; }
        .view-toggle button.active {
            background: var(--primary-color, #4B6EFB);
            color: #fff;
        }
        .show-inactive {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.875rem;
            color: #374151;
        }
        .student-name-link {
            background: none;
            border: 0;
            padding: 0;
            text-align: left;
            color: var(--primary-color, #4B6EFB);
            cursor: pointer;
            font: inherit;
        }
        .student-name-link:hover strong { text-decoration: underline; }
        .student-modal-tabs .tab-btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .student-modal-tabs .tab-btn.active {
            background: var(--primary-color, #4B6EFB);
            border-color: var(--primary-color, #4B6EFB);
            color: #fff;
        }
        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../images/logo.svg" alt="Logo">
                <h2>AI Fluency</h2>
            </div>

            <div class="sidebar-profile">
                <div class="profile-avatar">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <div class="profile-name">Instructor</div>
                <div class="profile-role">Instructor</div>
            </div>

            <nav class="sidebar-nav">
                <a href="/instructor/dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/student/courses.html" class="nav-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span>My Courses</span>
                </a>
                <a href="/instructor/courses.html" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span>Course Management</span>
                </a>
                <a href="/instructor/students.html" class="nav-item active">
                    <i class="fas fa-users"></i>
                    <span>Students</span>
                </a>
                <a href="/instructor/grading.html" class="nav-item">
                    <i class="fas fa-clipboard-check"></i>
                    <span>Grading</span>
                </a>
                <a href="/instructor/certificates.html" class="nav-item">
                    <i class="fas fa-certificate"></i>
                    <span>Certificates</span>
                </a>
                <a href="/instructor/analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
                <a href="/profile/edit.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <a href="#" onclick="Auth.logout(); return false;" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-topbar">
                <div class="topbar-left">
                    <h1>My Students</h1>
                </div>
                <div class="topbar-right">
                    <div class="topbar-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="student-search" placeholder="Search students...">
                    </div>
                </div>
            </div>

            <div class="dashboard-content" id="dashboard-content">
                <!-- Filter Bar -->
                <div class="dashboard-card" style="margin-bottom: 2rem;">
                    <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                        <div class="filter-group">
                            <label for="course-filter">Filter by Course:</label>
                            <select id="course-filter" style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color, #ccc);">
                                <option value="">All Courses</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="progress-filter">Progress:</label>
                            <select id="progress-filter" style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color, #ccc);">
                                <option value="">All</option>
                                <option value="not-started">Not Started</option>
                                <option value="in-progress">In Progress</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="sort-filter">Sort:</label>
                            <select id="sort-filter" style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color, #ccc);">
                                <option value="name:asc">Name (A–Z)</option>
                                <option value="progress:asc">Progress: low → high</option>
                                <option value="progress:desc">Progress: high → low</option>
                                <option value="last_active:desc">Last active: most recent</option>
                                <option value="last_active:asc">Last active: oldest first</option>
                            </select>
                        </div>
                        <label class="show-inactive">
                            <input type="checkbox" id="show-inactive"> Show inactive
                        </label>
                        <div class="view-toggle" role="tablist" aria-label="View mode">
                            <button type="button" id="view-roster" class="active" title="Full roster">
                                <i class="fas fa-users"></i> Roster
                            </button>
                            <button type="button" id="view-duplicates" title="Show only duplicate accounts">
                                <i class="fas fa-clone"></i> Duplicates
                            </button>
                        </div>
                        <button id="clear-filters-btn" class="btn-secondary btn-sm" type="button">
                            <i class="fas fa-times"></i> Clear filters
                        </button>
                        <button id="refresh-btn" class="btn-secondary btn-sm">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="dashboard-grid" style="margin-bottom: 2rem;">
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Total Students</div>
                                <div class="card-value" id="stat-total">0</div>
                            </div>
                            <div class="card-icon blue"><i class="fas fa-users"></i></div>
                        </div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Active This Week</div>
                                <div class="card-value" id="stat-active">0</div>
                            </div>
                            <div class="card-icon green"><i class="fas fa-user-check"></i></div>
                        </div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Avg. Progress</div>
                                <div class="card-value" id="stat-avg-progress">0%</div>
                            </div>
                            <div class="card-icon orange"><i class="fas fa-chart-line"></i></div>
                        </div>
                    </div>
                </div>

                <!-- Students Table -->
                <div class="dashboard-card">
                    <div id="students-container">
                        <div class="loading-spinner">Loading students...</div>
                    </div>
                    <div id="students-pager"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/script.js"></script>
    <script>
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        if (hamburger) {
            hamburger.addEventListener('click', function() {
                sidebar.classList.toggle('mobile-open');
            });
        }
    </script>

    <!-- Authentication System -->
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-template.js"></script>

    <!-- Instructor Students Module -->
    <script src="../js/instructor-students.js"></script>

    <!-- Page Protection -->
    <script>
        Auth.requireAuth(['teacher', 'superadmin', 'orgadmin', 'schooladmin']);
    </script>
</body>
</html>
