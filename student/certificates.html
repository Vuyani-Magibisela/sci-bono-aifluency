<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VNN90D4GDE"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VNN90D4GDE');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates - Sci-Bono AI Fluency</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .certificates-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .certificate-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .certificate-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .certificate-preview {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 2rem;
            color: white;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .certificate-preview i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .certificate-preview h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .certificate-preview .cert-type {
            font-size: 0.9rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .certificate-info {
            padding: 1.5rem;
        }

        .cert-number {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.5rem;
            font-family: monospace;
        }

        .cert-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .cert-description {
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 1rem;
        }

        .cert-date {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .cert-actions {
            display: flex;
            gap: 0.5rem;
        }

        .cert-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .cert-btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .cert-btn-primary:hover {
            background: var(--secondary-color);
        }

        .cert-btn-secondary {
            background: var(--background-light);
            color: var(--primary-color);
        }

        .cert-btn-secondary:hover {
            background: #e0e0e0;
        }

        .no-certificates {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .no-certificates i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 1rem;
        }

        .no-certificates h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .no-certificates p {
            color: var(--text-color);
            margin-bottom: 1.5rem;
        }

        .no-certificates .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: var(--transition);
        }

        .no-certificates .btn:hover {
            background: var(--secondary-color);
        }

        .verify-section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-top: 3rem;
        }

        .verify-section h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .verify-form {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .verify-form input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: monospace;
        }

        .verify-form button {
            padding: 0.75rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .verify-form button:hover {
            background: var(--secondary-color);
        }

        .verify-result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
        }

        .verify-result.valid {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .verify-result.invalid {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .verify-result h3 {
            margin-bottom: 0.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            z-index: 10;
        }

        .certificate-full {
            padding: 3rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .certificates-container {
                padding: 1rem;
            }

            .certificates-grid {
                grid-template-columns: 1fr;
            }

            .verify-form {
                flex-direction: column;
            }

            .modal-content {
                margin: 1rem;
            }

            .certificate-full {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="certificates-container">
        <div class="page-header">
            <h1><i class="fas fa-certificate"></i> My Certificates</h1>
            <p>View and download your earned certificates</p>
        </div>

        <div id="certificates-grid" class="certificates-grid">
            <div class="loading" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i>
                <p>Loading your certificates...</p>
            </div>
        </div>

        <div class="verify-section">
            <h2><i class="fas fa-shield-check"></i> Verify a Certificate</h2>
            <p>Enter a certificate number to verify its authenticity</p>
            <div class="verify-form">
                <input
                    type="text"
                    id="verify-input"
                    placeholder="e.g., SCIBONO-2025-A3F7B2"
                    maxlength="50"
                >
                <button id="verify-btn">
                    <i class="fas fa-search"></i> Verify
                </button>
            </div>
            <div id="verify-result"></div>
        </div>
    </div>

    <div id="certificate-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCertificateModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="certificate-full-view"></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-template.js"></script>
    <script src="../js/footer-template.js"></script>

    <!-- PDF generation libraries (already used elsewhere in the project) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // Cache fetched certificates by id so the modal/download don't refetch.
        const certificateCache = {};

        // Auth.requireAuth handles redirect on the rest of the site
        Auth.requireAuth();

        async function loadCertificates() {
            try {
                const data = await API.get('/certificates/my-certificates');
                const certs = data.data?.certificates || data.certificates || [];
                renderCertificates(certs);
            } catch (error) {
                console.error('Error loading certificates:', error);
                document.getElementById('certificates-grid').innerHTML = `
                    <div class="error" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; color: var(--accent-color);"></i>
                        <p>Failed to load certificates. Please try again later.</p>
                    </div>
                `;
            }
        }

        function renderCertificates(certificates) {
            const grid = document.getElementById('certificates-grid');

            if (certificates.length === 0) {
                grid.innerHTML = `
                    <div class="no-certificates" style="grid-column: 1 / -1;">
                        <i class="fas fa-certificate"></i>
                        <h2>No Certificates Yet</h2>
                        <p>Complete courses and modules to earn certificates!</p>
                        <a href="/student/dashboard.html" class="btn">Go to Dashboard</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = certificates.map(cert => {
                certificateCache[cert.id] = cert;

                const dateValue = cert.issue_date || cert.effective_issue_date || cert.issued_date;
                const issueDate = dateValue
                    ? new Date(dateValue).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
                    : '';

                const typeIcons = {
                    'course_completion': 'fa-graduation-cap',
                    'module_completion': 'fa-book',
                    'quiz_achievement': 'fa-trophy',
                    'custom': 'fa-award'
                };
                const certType = cert.certificate_type || 'course_completion';
                const icon = typeIcons[certType] || 'fa-certificate';
                const title = cert.title || cert.course_title || 'Certificate of Completion';

                return `
                    <div class="certificate-card">
                        <div class="certificate-preview">
                            <i class="fas ${icon}"></i>
                            <h3>${escapeHtml(title)}</h3>
                            <div class="cert-type">${certType.replace(/_/g, ' ')}</div>
                        </div>
                        <div class="certificate-info">
                            <div class="cert-number">
                                <i class="fas fa-fingerprint"></i> ${escapeHtml(cert.certificate_number)}
                            </div>
                            ${cert.description ? `
                                <div class="cert-description">${escapeHtml(cert.description)}</div>
                            ` : ''}
                            <div class="cert-date">
                                <i class="fas fa-calendar"></i> Issued: ${issueDate}
                            </div>
                            <div class="cert-actions">
                                <button class="cert-btn cert-btn-primary" onclick="viewCertificate(${cert.id})">
                                    <i class="fas fa-eye"></i> View
                                </button>
                                <button class="cert-btn cert-btn-secondary" onclick="downloadCertificate(${cert.id})">
                                    <i class="fas fa-download"></i> Download
                                </button>
                                <button class="cert-btn cert-btn-secondary" onclick="shareCertificate('${cert.certificate_number}')">
                                    <i class="fas fa-share"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Fetch full certificate payload (recipient + course + template config + bg url).
        async function fetchCertificatePayload(certId) {
            const data = await API.get(`/certificates/${certId}/download`);
            return data.data || data;
        }

        // Render the certificate as HTML inside `host` using the template config.
        // Returns the host element so the caller can capture/print/discard it.
        function renderCertificateHtml(host, payload) {
            const cert = payload.certificate || {};
            const cfg = payload.template_config || {};
            const bg = payload.background_url || '';

            const borderColor = cfg.border_color || '#4B6EFB';
            const titleColor  = cfg.title_color  || '#333333';
            const textColor   = cfg.text_color   || '#666666';
            const sigs = Array.isArray(cfg.signature_lines) && cfg.signature_lines.length
                ? cfg.signature_lines
                : ['Instructor', 'Program Director'];

            const title       = cert.title || cert.course_title || 'Certificate of Completion';
            const recipient   = cert.student_name || 'Recipient';
            const description = cert.description || `Has successfully completed the course "${cert.course_title || ''}".`;
            const certNumber  = cert.certificate_number || '';
            const issueDate   = cert.issue_date || cert.effective_issue_date || cert.issued_date;
            const issueText   = issueDate ? new Date(issueDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';

            host.innerHTML = `
                <div class="rendered-cert" style="
                    width: 1100px; max-width: 100%;
                    aspect-ratio: 1.414 / 1;
                    background: #fff ${bg ? `url('${bg}') center/cover no-repeat` : ''};
                    border: 8px solid ${borderColor};
                    box-sizing: border-box;
                    padding: 60px 60px;
                    color: ${textColor};
                    text-align: center;
                    display: flex; flex-direction: column; align-items: center; justify-content: center;
                    font-family: 'Outfit', 'Montserrat', sans-serif;
                    position: relative;
                ">
                    <div style="font-size: 14px; letter-spacing: 4px; color: ${textColor}; text-transform: uppercase;">Sci-Bono AI Fluency</div>
                    <h1 style="font-size: 44px; color: ${titleColor}; margin: 12px 0 6px;">${escapeHtml(title)}</h1>
                    <div style="font-size: 16px; color: ${textColor}; margin-bottom: 28px;">This is to certify that</div>
                    <div style="font-size: 36px; color: ${titleColor}; font-weight: 700; margin-bottom: 28px; border-bottom: 2px solid ${borderColor}; padding-bottom: 8px; min-width: 60%;">
                        ${escapeHtml(recipient)}
                    </div>
                    <div style="font-size: 16px; color: ${textColor}; max-width: 80%; line-height: 1.6;">
                        ${escapeHtml(description)}
                    </div>
                    <div style="display: flex; gap: 80px; margin-top: 60px;">
                        ${sigs.map(s => `
                            <div style="text-align: center; min-width: 150px;">
                                <div style="border-top: 1px solid ${textColor}; padding-top: 6px; font-size: 13px; color: ${textColor};">
                                    ${escapeHtml(s)}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="position: absolute; bottom: 24px; left: 24px; font-size: 11px; color: ${textColor};">
                        Issued: ${escapeHtml(issueText)}
                    </div>
                    <div style="position: absolute; bottom: 24px; right: 24px; font-size: 11px; color: ${textColor}; font-family: monospace;">
                        ${escapeHtml(certNumber)}
                    </div>
                </div>
            `;
            return host;
        }

        async function viewCertificate(certId) {
            try {
                const payload = await fetchCertificatePayload(certId);
                const host = document.getElementById('certificate-full-view');
                host.innerHTML = '';
                renderCertificateHtml(host, payload);
                document.getElementById('certificate-modal').classList.add('active');
            } catch (error) {
                console.error('Error viewing certificate:', error);
                if (String(error.message).toLowerCase().includes('revoked')) {
                    alert('This certificate has been revoked.');
                } else {
                    alert('Failed to load certificate details');
                }
            }
        }

        function closeCertificateModal() {
            document.getElementById('certificate-modal').classList.remove('active');
        }

        async function downloadCertificate(certId) {
            const offscreen = document.createElement('div');
            offscreen.style.cssText = 'position:fixed; left:-99999px; top:0; width:1100px;';
            document.body.appendChild(offscreen);
            try {
                const payload = await fetchCertificatePayload(certId);
                renderCertificateHtml(offscreen, payload);
                const target = offscreen.firstElementChild;

                const canvas = await html2canvas(target, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#FFFFFF'
                });
                const imgData = canvas.toDataURL('image/png');

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, pageHeight);

                const certNum = payload.certificate?.certificate_number || ('cert-' + certId);
                pdf.save(`${certNum}.pdf`);
            } catch (error) {
                console.error('Error downloading certificate:', error);
                alert('Failed to generate the certificate PDF: ' + error.message);
            } finally {
                offscreen.remove();
            }
        }

        function shareCertificate(certNumber) {
            const verifyUrl = `${window.location.origin}/certificates.html?verify=${certNumber}`;

            if (navigator.share) {
                navigator.share({
                    title: 'My Certificate - Sci-Bono AI Fluency',
                    text: `Check out my certificate! Verify it here: ${certNumber}`,
                    url: verifyUrl
                }).catch(err => console.log('Error sharing:', err));
            } else {
                navigator.clipboard.writeText(verifyUrl).then(() => {
                    alert('Verification link copied to clipboard!');
                }).catch(() => {
                    alert(`Verification URL: ${verifyUrl}`);
                });
            }
        }

        async function verifyCertificate() {
            const certNumber = document.getElementById('verify-input').value.trim();
            const resultDiv = document.getElementById('verify-result');

            if (!certNumber) {
                resultDiv.innerHTML = `
                    <div class="verify-result invalid">
                        <i class="fas fa-exclamation-circle"></i>
                        Please enter a certificate number
                    </div>
                `;
                return;
            }

            resultDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Verifying...</div>';

            try {
                const response = await fetch(`/api/certificates/verify/${encodeURIComponent(certNumber)}`);

                if (!response.ok) {
                    throw new Error('Verification failed');
                }

                const data = await response.json();

                if (data.valid) {
                    const cert = data.certificate;
                    resultDiv.innerHTML = `
                        <div class="verify-result valid">
                            <h3><i class="fas fa-check-circle"></i> Certificate Valid</h3>
                            <p><strong>Recipient:</strong> ${escapeHtml(cert.student_name)}</p>
                            <p><strong>Title:</strong> ${escapeHtml(cert.title)}</p>
                            <p><strong>Issued:</strong> ${new Date(cert.issue_date).toLocaleDateString()}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="verify-result invalid">
                            <h3><i class="fas fa-times-circle"></i> ${data.status === 'revoked' ? 'Certificate Revoked' : 'Invalid Certificate'}</h3>
                            <p>${escapeHtml(data.message)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error verifying certificate:', error);
                resultDiv.innerHTML = `
                    <div class="verify-result invalid">
                        <h3><i class="fas fa-exclamation-triangle"></i> Verification Error</h3>
                        <p>Unable to verify certificate. Please try again later.</p>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('verify-btn').addEventListener('click', verifyCertificate);
        document.getElementById('verify-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyCertificate();
            }
        });

        // Close modal on outside click
        document.getElementById('certificate-modal').addEventListener('click', (e) => {
            if (e.target.id === 'certificate-modal') {
                closeCertificateModal();
            }
        });

        // Check for verify parameter in URL
        const urlParams = new URLSearchParams(window.location.search);
        const verifyParam = urlParams.get('verify');
        if (verifyParam) {
            document.getElementById('verify-input').value = verifyParam;
            setTimeout(() => verifyCertificate(), 500);
        }

        // Initialize
        loadCertificates();
    </script>
</body>
</html>
