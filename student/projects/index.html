<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VNN90D4GDE"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VNN90D4GDE');
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4B6EFB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Fluency">

    <!-- Manifest and Icons -->
    <link rel="manifest" href="../../manifest.json">
    <link rel="apple-touch-icon" href="../../images/apple-touch-icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Projects - Sci-Bono AI Fluency</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../../images/favicon.ico">

    <style>
        /* ---- Hero ---- */
        .projects-hero {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            text-align: center;
            padding: 4rem 2rem 3rem;
        }

        .projects-hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .projects-hero p {
            font-size: 1.2rem;
            opacity: 0.95;
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        /* ---- Login prompt ---- */
        #login-prompt {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            gap: 1.5rem;
        }

        #login-prompt i {
            font-size: 3rem;
            color: var(--primary-color);
            opacity: 0.7;
        }

        #login-prompt p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 480px;
        }

        #login-prompt a.login-cta {
            background: var(--primary-color);
            color: var(--white);
            padding: 0.75rem 2rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
        }

        #login-prompt a.login-cta:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }

        /* ---- Filters ---- */
        .filters-container {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            padding: 2rem 2rem 1rem;
            background-color: var(--white);
        }

        .filter-btn-custom {
            background-color: var(--background-light);
            color: var(--text-dark);
            border: 2px solid var(--grey-light);
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .filter-btn-custom:hover {
            border-color: var(--primary-color);
            background-color: rgba(75, 110, 251, 0.1);
            color: var(--primary-color);
        }

        .filter-btn-custom.active {
            background-color: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        /* ---- Grid ---- */
        .projects-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        /* ---- Project cards ---- */
        .project-card-custom {
            background-color: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: var(--transition);
            cursor: pointer;
        }

        .project-card-custom:hover:not(.project-locked) {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        /* Locked state */
        .project-card-custom.project-locked {
            opacity: 0.62;
            cursor: default;
        }

        .project-header {
            height: 160px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .project-icon {
            font-size: 4rem;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        /* Lock overlay */
        .lock-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--white);
            text-align: center;
            padding: 1rem;
            z-index: 3;
        }

        .lock-overlay i {
            font-size: 2rem;
        }

        .lock-overlay span {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .project-content {
            padding: 1.25rem 1.5rem 1.5rem;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--text-dark);
        }

        .project-meta {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .meta-badge {
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        /* Status badges */
        .status-not-started  { background: rgba(100,100,100,.12); color: #555; }
        .status-in-progress  { background: rgba(255,152,0,.15);   color: #e65100; }
        .status-completed    { background: rgba(76,175,80,.15);   color: #2e7d32; }
        .status-returned     { background: rgba(244,67,54,.15);   color: #b71c1c; }

        .module-badge {
            background-color: rgba(75, 110, 251, 0.12);
            color: var(--primary-color);
        }

        .duration-badge {
            background-color: rgba(75, 251, 157, 0.15);
            color: #00A86B;
        }

        .project-description {
            color: var(--text-light);
            margin-bottom: 1rem;
            line-height: 1.55;
            font-size: 0.93rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--grey-light);
        }

        .project-dates {
            font-size: 0.82rem;
            color: var(--text-light);
        }

        .score-display {
            font-size: 0.82rem;
            font-weight: 600;
            color: #2e7d32;
            margin-left: 0.5rem;
        }

        /* ---- Action buttons ---- */
        .action-btn {
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .start-btn {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .start-btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            color: var(--white);
        }

        .in-progress-btn {
            background-color: #ff9800;
            color: var(--white);
        }

        .in-progress-btn:hover {
            background-color: #e65100;
            color: var(--white);
        }

        .completed-btn {
            background-color: #4caf50;
            color: var(--white);
        }

        .completed-btn:hover {
            background-color: #2e7d32;
            color: var(--white);
        }

        .returned-btn {
            background-color: #f44336;
            color: var(--white);
        }

        .returned-btn:hover {
            background-color: #b71c1c;
            color: var(--white);
        }

        .locked-btn {
            background-color: var(--grey-light);
            color: #999;
            cursor: not-allowed;
        }

        /* ---- Empty / loading / error states ---- */
        .empty-state, .loading-state, .error-message {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-light);
        }

        .empty-state i, .loading-state i, .error-message i {
            font-size: 2.5rem;
            opacity: 0.5;
        }

        /* ---- Modal ---- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content-custom {
            background: var(--white);
            margin: 3rem auto;
            max-width: 750px;
            border-radius: 20px;
            position: relative;
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from { transform: translateY(-50px); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }

        .modal-header-custom {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 2rem 2.5rem;
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .modal-title {
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .modal-header-custom .meta-badge {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .modal-header-custom .status-not-started { color: #555; }
        .modal-header-custom .status-in-progress  { color: #e65100; }
        .modal-header-custom .status-completed    { color: #2e7d32; }
        .modal-header-custom .status-returned     { color: #b71c1c; }
        .modal-header-custom .module-badge        { color: var(--primary-color); }
        .modal-header-custom .duration-badge      { color: #00A86B; }

        .close-modal {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: var(--white);
            font-size: 1.4rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: rotate(90deg);
        }

        /* hidden — kept for backwards-compat with existing openModal logic */
        .detailed-guide-btn { display: none !important; }

        .modal-body-custom {
            padding: 2rem 2.5rem;
        }

        .modal-section {
            margin-bottom: 2rem;
        }

        .modal-section h3 {
            color: var(--primary-color);
            margin-bottom: 0.75rem;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-section p {
            color: var(--text-dark);
            line-height: 1.7;
        }

        .modal-section ul {
            list-style: none;
            padding-left: 0;
        }

        .modal-section ul li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--grey-light);
            color: var(--text-dark);
        }

        .modal-section ul li:last-child { border-bottom: none; }

        .modal-section ul li::before {
            content: "✓ ";
            color: var(--primary-color);
            font-weight: bold;
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .projects-hero h1 { font-size: 2.2rem; }
            .projects-grid { grid-template-columns: 1fr; }
            .modal-content-custom { margin: 1rem; }
            .modal-header-custom, .modal-body-custom { padding: 1.5rem; }
            .filters-container { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>

    <section class="projects-hero">
        <h1>AI Projects</h1>
        <p>Apply your AI skills through hands-on projects tied to each course module</p>
    </section>

    <!-- Login prompt — shown to unauthenticated visitors -->
    <div id="login-prompt">
        <i class="fas fa-lock"></i>
        <p>Log in and enroll in a course to view projects</p>
        <a href="/public/login.html?redirect=%2Fstudent%2Fprojects%2Findex.html" class="login-cta">
            <i class="fas fa-sign-in-alt"></i> Log In
        </a>
    </div>

    <!-- Course filter buttons (populated by JS) -->
    <div class="filters-container" id="filters-container"></div>

    <main class="projects-container">
        <!-- TODO: Add standalone projects that are not dependent on a course -->
        <div class="projects-grid" id="projectsGrid"></div>
    </main>

    <!-- Modal (repurposed for API-driven project data) -->
    <div id="projectModal" class="modal-overlay">
        <div class="modal-content-custom">
            <div class="modal-header-custom">
                <button class="close-modal" id="closeModalBtn">&times;</button>
                <!-- Kept for backward-compat; hidden via CSS -->
                <a href="#" id="detailedGuideBtn" class="detailed-guide-btn">
                    <i class="fas fa-book-open"></i>
                    <span>View Full Guide</span>
                </a>
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="project-meta" id="modalMeta"></div>
            </div>
            <div class="modal-body-custom" id="modalBody"></div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 AI Fluency Course</p>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Use</a>
            </div>
        </div>
    </footer>

    <script src="../../js/script.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/header-template.js"></script>
    <script src="../../js/student-projects.js"></script>
    <script>
        // Modal close logic
        document.addEventListener('DOMContentLoaded', function () {
            const modal = document.getElementById('projectModal');

            document.getElementById('closeModalBtn').addEventListener('click', () => {
                modal.style.display = 'none';
            });

            modal.addEventListener('click', function (e) {
                if (e.target === modal) modal.style.display = 'none';
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') modal.style.display = 'none';
            });
        });
    </script>
</body>
</html>
