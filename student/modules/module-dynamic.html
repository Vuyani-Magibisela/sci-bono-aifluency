<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4B6EFB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Fluency">

    <!-- Manifest and Icons -->
    <link rel="manifest" href="../../manifest.json">
    <link rel="apple-touch-icon" href="/images/icon-192x192.png">

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('Service Worker registered with scope:', registration.scope);
            })
            .catch(error => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AI Fluency - Module</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/stylesModules.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../../images/favicon.ico">
    <style>
        .module-requirements-section {
            max-width: 700px;
            margin: 2rem auto;
            padding: 2rem;
            background: #f8f9ff;
            border-radius: 15px;
            border: 1px solid #e0e5ff;
        }
        .module-requirements-section h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .requirements-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .requirement-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: white;
            border-radius: 10px;
            font-size: 1rem;
        }
        .requirement-item.completed i { color: #00D084; }
        .requirement-item.pending i { color: #999; }
        .requirements-note {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        /* Quiz and Project card variants */
        .chapter-card--quiz .chapter-card-icon,
        .chapter-card--project .chapter-card-icon {
            background: none;
        }
        .chapter-card--quiz .chapter-card-icon i { color: #f57c00; }
        .chapter-card--project .chapter-card-icon i { color: #388e3c; }

        .chapter-card-type {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
        }
        .chapter-card--quiz .chapter-card-type {
            background: #fff3e0;
            color: #f57c00;
        }
        .chapter-card--project .chapter-card-type {
            background: #e8f5e9;
            color: #388e3c;
        }
        .chapter-card-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            margin: 0.5rem 0 0.75rem;
        }
        .chapter-card-status.status-done { color: #4caf50; }
        .chapter-card-status.status-pending { color: #999; }
    </style>
</head>
<body>
    <!-- Dynamic Header (Phase 1 Integration) -->
    <div id="header-placeholder"></div>

    <main>
        <div class="module-container">
            <!-- Breadcrumb Navigation (Phase 5D Priority 2) -->
            <div id="breadcrumb-container"></div>

            <!-- Module header will be populated dynamically -->
            <div class="module-header">
                <h1 id="module-title">Loading module...</h1>
                <p class="subtitle" id="module-subtitle"></p>
            </div>

            <div class="module-intro">
                <div class="module-intro-content" id="module-intro">
                    <div class="loading-spinner">Loading module information...</div>
                </div>
                <div class="module-intro-image">
                    <svg width="200" height="200" viewBox="0 0 200 200">
                        <!-- Brain with network connections -->
                        <ellipse cx="100" cy="100" rx="70" ry="60" fill="none" stroke="#4B6EFB" stroke-width="2" />
                        <path d="M70 80 Q100 40, 130 80" fill="none" stroke="#4B6EFB" stroke-width="2" />
                        <path d="M70 120 Q100 160, 130 120" fill="none" stroke="#4B6EFB" stroke-width="2" />
                        <line x1="70" y1="100" x2="130" y2="100" stroke="#4B6EFB" stroke-width="2" />

                        <!-- Nodes -->
                        <circle cx="70" cy="80" r="5" fill="#FB4B4B" />
                        <circle cx="130" cy="80" r="5" fill="#FB4B4B" />
                        <circle cx="70" cy="120" r="5" fill="#FB4B4B" />
                        <circle cx="130" cy="120" r="5" fill="#FB4B4B" />
                        <circle cx="70" cy="100" r="5" fill="#FB4B4B" />
                        <circle cx="130" cy="100" r="5" fill="#FB4B4B" />
                        <circle cx="100" cy="60" r="5" fill="#FB4B4B" />
                        <circle cx="100" cy="140" r="5" fill="#FB4B4B" />

                        <!-- Connect all nodes -->
                        <line x1="70" y1="80" x2="70" y2="100" stroke="#4B6EFB" stroke-width="1" />
                        <line x1="70" y1="100" x2="70" y2="120" stroke="#4B6EFB" stroke-width="1" />
                        <line x1="130" y1="80" x2="130" y2="100" stroke="#4B6EFB" stroke-width="1" />
                        <line x1="130" y1="100" x2="130" y2="120" stroke="#4B6EFB" stroke-width="1" />
                        <line x1="70" y1="80" x2="100" y2="60" stroke="#4B6EFB" stroke-width="1" />
                        <line x1="130" y1="80" x2="100" y2="60" stroke="#4B6EFB" stroke-width="1" />
                        <line x1="70" y1="120" x2="100" y2="140" stroke="#4B6EFB" stroke-width="1" />
                        <line x1="130" y1="120" x2="100" y2="140" stroke="#4B6EFB" stroke-width="1" />
                    </svg>
                </div>
            </div>

            <!-- Lessons grid will be populated dynamically -->
            <div class="chapters-grid" id="lessons-container">
                <div class="loading-spinner">Loading lessons...</div>
            </div>

            <!-- Module Completion Requirements -->
            <div class="module-requirements-section" id="module-requirements" style="display: none;">
                <h2>Module Completion Requirements</h2>
                <div class="requirements-list">
                    <div class="requirement-item pending" id="req-quiz">
                        <i class="fas fa-circle"></i>
                        <span>Pass the Module Quiz</span>
                    </div>
                    <div class="requirement-item pending" id="req-project">
                        <i class="fas fa-circle"></i>
                        <span>Submit the Module Project</span>
                    </div>
                </div>
                <p class="requirements-note">Complete both to unlock the next module.</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 Sci-Bono AI Fluency Course. All rights reserved.</p>
            <div class="footer-links">
                <a href="index.html">Home</a>
            </div>
        </div>
    </footer>

    <script src="../../js/script.js"></script>
    <!-- Authentication System (Phase 1) -->
    <script src="../../js/storage.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/header-template.js"></script>

    <!-- Utility Functions -->
    <script src="../../js/utils.js"></script>

    <!-- Content Loader (Phase 5C) -->
    <script src="../../js/content-loader.js"></script>

    <!-- Breadcrumb Navigation (Phase 5D Priority 2) -->
    <script src="../../js/breadcrumb.js"></script>

    <!-- Module Page Logic -->
    <script>
        (async function() {
            const moduleId = ContentLoader.getUrlParam('module_id');

            if (!moduleId) {
                ContentLoader.showError('#lessons-container', 'No module specified. Please select a module from the home page.');
                return;
            }

            // Proactively refresh the auth token before loading content.
            // The quiz endpoint returns 200 even without auth (just omits user_best_score),
            // so the normal 401-triggered refresh never fires. We must refresh here
            // to ensure authenticated quiz status is returned.
            try {
                if (Auth.isAuthenticated()) {
                    await Auth.checkAuthOnPageLoad();
                } else if (Storage.get('refresh_token')) {
                    await API.refreshToken();
                }
            } catch (e) {
                // Ignore refresh errors — page still loads, just without user-specific data
            }

            try {
                // Load module and lessons
                const moduleData = await ContentLoader.loadModule(moduleId);
                const courseId = ContentLoader.getUrlParam('course_id') || moduleData.module.course_id;

                // Page title
                document.title = `AI Fluency - ${moduleData.module.title}`;
                document.getElementById('page-title').textContent = document.title;

                // Breadcrumb
                Breadcrumb.render('breadcrumb-container', {
                    course: { id: courseId, title: 'AI Fluency Course' },
                    module: { title: moduleData.module.title }
                });

                // Render lessons
                ContentLoader.renderModulePage(moduleData, {
                    title: '#module-title',
                    subtitle: '#module-subtitle',
                    lessonsContainer: '#lessons-container'
                });

                // Intro text
                const introContainer = document.getElementById('module-intro');
                if (moduleData.module.description) {
                    introContainer.innerHTML = `
                        <p>Welcome to ${ContentLoader.escapeHtml(moduleData.module.title)}! ${ContentLoader.escapeHtml(moduleData.module.description)}</p>
                        <p>Choose a lesson below to begin your learning journey.</p>
                    `;
                }

                // Load quiz and project in parallel
                let quizData = null, quizPassed = false;
                let projectData = null, projectSubmitted = false;

                const [quizResult, projectResult] = await Promise.allSettled([
                    ContentLoader.loadQuiz(moduleId),
                    API.get(`/projects?module_id=${moduleId}`)
                ]);

                // Process quiz result
                if (quizResult.status === 'fulfilled' && quizResult.value && quizResult.value.questions?.length > 0) {
                    quizData = quizResult.value;
                    // user_best_score is returned by GET /quizzes?module_id=X for authenticated users
                    if (quizData.user_best_score !== null && quizData.user_best_score !== undefined) {
                        quizPassed = quizData.user_best_score >= (quizData.passing_score || 70);
                    }
                }

                // Process project result
                if (projectResult.status === 'fulfilled' && projectResult.value?.success) {
                    const items = projectResult.value.data?.items || [];
                    if (items.length > 0) {
                        projectData = items[0];
                        projectSubmitted = projectData.user_submission !== null && projectData.user_submission !== undefined;
                    }
                }

                // Append quiz and project cards to lessons grid
                const lessonsContainer = document.getElementById('lessons-container');
                const quizUrl = `../quizzes/quiz-dynamic.html?module_id=${moduleId}&course_id=${courseId || ''}`;

                if (quizData) {
                    const quizStatusClass = quizPassed ? 'status-done' : 'status-pending';
                    const quizStatusIcon = quizPassed ? 'fa-check-circle' : 'fa-circle';
                    const quizStatusText = quizPassed ? 'Passed' : 'Not attempted';
                    const quizLinkText = quizPassed ? 'Retake Quiz' : 'Take Quiz';
                    lessonsContainer.insertAdjacentHTML('beforeend', `
                        <div class="chapter-card chapter-card--quiz">
                            <div class="chapter-card-icon"><i class="fas fa-clipboard-list"></i></div>
                            <div class="chapter-card-content">
                                <span class="chapter-card-type">Quiz</span>
                                <h3>${ContentLoader.escapeHtml(quizData.title || 'Module Quiz')}</h3>
                                ${quizData.description ? `<p>${ContentLoader.escapeHtml(quizData.description)}</p>` : '<p>Test your knowledge of this module.</p>'}
                                <div class="chapter-card-status ${quizStatusClass}">
                                    <i class="fas ${quizStatusIcon}"></i> ${quizStatusText}
                                </div>
                                <a href="${quizUrl}" class="chapter-link">${quizLinkText}</a>
                            </div>
                        </div>
                    `);
                }

                if (projectData) {
                    const projStatusClass = projectSubmitted ? 'status-done' : 'status-pending';
                    const projStatusIcon = projectSubmitted ? 'fa-check-circle' : 'fa-circle';
                    const projStatusText = projectSubmitted ? 'Submitted' : 'Not submitted';
                    const projLinkText = projectSubmitted ? 'View Submission' : 'Submit Project';
                    lessonsContainer.insertAdjacentHTML('beforeend', `
                        <div class="chapter-card chapter-card--project">
                            <div class="chapter-card-icon"><i class="fas fa-folder-open"></i></div>
                            <div class="chapter-card-content">
                                <span class="chapter-card-type">Project</span>
                                <h3>${ContentLoader.escapeHtml(projectData.title || 'Module Project')}</h3>
                                ${projectData.description ? `<p>${ContentLoader.escapeHtml(projectData.description)}</p>` : '<p>Apply what you\'ve learned in this module.</p>'}
                                <div class="chapter-card-status ${projStatusClass}">
                                    <i class="fas ${projStatusIcon}"></i> ${projStatusText}
                                </div>
                                <a href="/student/projects/submit.html?id=${projectData.id}" class="chapter-link">${projLinkText}</a>
                            </div>
                        </div>
                    `);
                }

                // Update requirements section
                const reqSection = document.getElementById('module-requirements');
                const reqQuiz = document.getElementById('req-quiz');
                const reqProject = document.getElementById('req-project');

                if (quizPassed) {
                    reqQuiz.classList.replace('pending', 'completed');
                    reqQuiz.querySelector('i').className = 'fas fa-check-circle';
                }
                if (projectSubmitted) {
                    reqProject.classList.replace('pending', 'completed');
                    reqProject.querySelector('i').className = 'fas fa-check-circle';
                }
                reqSection.style.display = 'block';

            } catch (error) {
                console.error('Error loading module:', error);
                ContentLoader.showError('#lessons-container', 'Failed to load module content. Please try again later.');
            }
        })();
    </script>
</body>
</html>
