<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VNN90D4GDE"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VNN90D4GDE');
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4B6EFB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Fluency">

    <!-- Manifest and Icons -->
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Course Overview - AI Fluency</title>
    <meta name="description" content="View course modules and track your progress">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">

    <style>
        /* Course View Page Styles */
        .course-view-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .course-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 3rem 2rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            box-shadow: 0 8px 30px rgba(75, 110, 251, 0.3);
        }

        .course-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .course-header p {
            font-size: 1.2rem;
            opacity: 0.95;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .course-meta {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .meta-item i {
            font-size: 1.2rem;
        }

        .course-gating-info {
            font-size: 0.95rem;
            opacity: 0.85;
            font-style: italic;
        }
        .course-gating-info i {
            margin-right: 0.3rem;
        }

        .progress-section {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 3rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .progress-section h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .progress-bar-large {
            width: 100%;
            height: 20px;
            background-color: var(--grey-light);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .modules-section h2 {
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 2rem;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .module-card {
            background-color: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .module-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .module-card.locked:hover {
            transform: none;
        }

        .module-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 2rem;
            position: relative;
        }

        .module-number {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .module-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .module-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .module-body {
            padding: 1.5rem;
        }

        .module-description {
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .module-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--grey-light);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .stat-item i {
            color: var(--primary-color);
        }

        .module-progress {
            margin-top: 1rem;
        }

        .module-progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--grey-light);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .module-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4BFB9D, #00D084);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .module-progress-text {
            font-size: 0.85rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .module-status {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        .module-status.completed {
            background-color: rgba(75, 251, 157, 0.15);
            color: #00D084;
        }

        .module-status.in-progress {
            background-color: rgba(75, 110, 251, 0.15);
            color: var(--primary-color);
        }

        .module-status.locked {
            background-color: rgba(0, 0, 0, 0.1);
            color: var(--text-light);
        }

        .module-status.not-started {
            background-color: rgba(251, 75, 75, 0.15);
            color: #FB4B4B;
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: var(--text-light);
            opacity: 0.3;
        }

        .module-requirements {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background: rgba(251, 75, 75, 0.08);
            border-radius: 8px;
            color: #FB4B4B;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .module-requirements i {
            font-size: 0.9rem;
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .loading-spinner i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .error-message i {
            font-size: 4rem;
            color: #FB4B4B;
            margin-bottom: 1rem;
        }

        .error-message p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .course-header h1 {
                font-size: 2rem;
            }

            .course-header p {
                font-size: 1rem;
            }

            .course-meta {
                gap: 1rem;
            }

            .modules-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .module-icon {
                font-size: 2rem;
            }

            .module-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>

    <main>
        <div class="course-view-container">
            <!-- Course Header (Will be populated dynamically) -->
            <div id="course-header" class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading course...</p>
            </div>

            <!-- Progress Section -->
            <div id="progress-section" style="display: none;"></div>

            <!-- Modules Section -->
            <div class="modules-section">
                <h2>Course Modules</h2>
                <div id="modules-grid" class="modules-grid">
                    <!-- Modules will be loaded here -->
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading modules...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 AI Fluency Course</p>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Use</a>
            </div>
        </div>
    </footer>

    <script src="../js/script.js"></script>
    <!-- Authentication System -->
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-template.js"></script>

    <!-- Course View Logic -->
    <script src="../js/course-view.js"></script>
</body>
</html>
