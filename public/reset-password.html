    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Fluency</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>

    <main>
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <i class="fas fa-lock-open"></i>
                        <h2>Set New Password</h2>
                        <p>Enter your new password below</p>
                    </div>

                    <form class="auth-form" id="resetPasswordForm">
                        <div class="form-group">
                            <label for="password">
                                <i class="fas fa-lock"></i>
                                New Password
                            </label>
                            <input type="password" id="password" name="password"
                                   placeholder="Enter new password" required minlength="8">
                            <ul class="pw-reqs" id="pwReqs">
                                <li id="req-length"  class="pw-req"><i class="fas fa-circle"></i> At least 8 characters</li>
                                <li id="req-upper"   class="pw-req"><i class="fas fa-circle"></i> One uppercase letter (A-Z)</li>
                                <li id="req-lower"   class="pw-req"><i class="fas fa-circle"></i> One lowercase letter (a-z)</li>
                                <li id="req-number"  class="pw-req"><i class="fas fa-circle"></i> One number (0-9)</li>
                                <li id="req-special" class="pw-req"><i class="fas fa-circle"></i> One special character (!@#$%^&amp;*)</li>
                            </ul>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">
                                <i class="fas fa-lock"></i>
                                Confirm New Password
                            </label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   placeholder="Confirm new password" required>
                        </div>

                        <button type="submit" class="auth-btn" id="submitBtn">
                            <i class="fas fa-check"></i>
                            Reset Password
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p>Remember your password? <a href="/public/login.html" class="link-text">Login</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 AI Fluency Course</p>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="/privacy-policy.html">Privacy Policy</a>
                <a href="/terms-of-use.html">Terms of Use</a>
            </div>
        </div>
    </footer>

    <!-- Core scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-template.js"></script>
    <script src="../js/script.js"></script>

    <script>
    (function () {
        'use strict';

        const API_BASE = '/api';

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // If no token, show error
        if (!token) {
            document.addEventListener('DOMContentLoaded', function () {
                document.getElementById('resetPasswordForm').style.display = 'none';
                showError('Invalid reset link. No token provided. <a href="/public/forgot-password.html" class="link-text">Request a new link</a>');
            });
        }

        // Password strength rules (same as signup)
        const PW_RULES = [
            { id: 'req-length',  test: function(pw) { return pw.length >= 8; } },
            { id: 'req-upper',   test: function(pw) { return /[A-Z]/.test(pw); } },
            { id: 'req-lower',   test: function(pw) { return /[a-z]/.test(pw); } },
            { id: 'req-number',  test: function(pw) { return /[0-9]/.test(pw); } },
            { id: 'req-special', test: function(pw) { return /[!@#$%^&*(),.?":{}|<>]/.test(pw); } },
        ];

        function checkPasswordStrength(pw) {
            var allOk = true;
            PW_RULES.forEach(function (r) {
                var el = document.getElementById(r.id);
                var ok = r.test(pw);
                if (!ok) allOk = false;
                if (el) {
                    el.classList.toggle('pw-req-ok', ok);
                    el.classList.toggle('pw-req-fail', pw.length > 0 && !ok);
                    el.querySelector('i').className = ok ? 'fas fa-check-circle' : 'fas fa-circle';
                }
            });
            return allOk;
        }

        document.addEventListener('DOMContentLoaded', function () {
            var pwInput = document.getElementById('password');
            var confirmInput = document.getElementById('confirmPassword');

            // Password strength checker
            pwInput.addEventListener('input', function () {
                checkPasswordStrength(pwInput.value);
                document.getElementById('pwReqs').style.display = 'block';
            });
            pwInput.addEventListener('focus', function () {
                document.getElementById('pwReqs').style.display = 'block';
            });

            // Confirm password match check
            confirmInput.addEventListener('input', function () {
                var match = this.value === pwInput.value;
                this.setCustomValidity(match ? '' : 'Passwords do not match');
                this.classList.toggle('error', !match && this.value.length > 0);
            });

            // Form submit
            document.getElementById('resetPasswordForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                var btn      = document.getElementById('submitBtn');
                var origHTML = btn.innerHTML;
                var password = pwInput.value;
                var confirmP = confirmInput.value;

                clearMessages();

                if (!password || !confirmP) {
                    showError('Please fill in both password fields.');
                    return;
                }

                if (!checkPasswordStrength(password)) {
                    document.getElementById('pwReqs').style.display = 'block';
                    showError('Password does not meet the requirements shown below.');
                    return;
                }

                if (password !== confirmP) {
                    showError('Passwords do not match.');
                    return;
                }

                btn.disabled  = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

                try {
                    var formData = new FormData();
                    formData.append('token', token);
                    formData.append('password', password);
                    formData.append('password_confirmation', confirmP);

                    var res  = await fetch(API_BASE + '/auth/reset-password', {
                        method: 'POST',
                        body: formData
                    });
                    var json = await res.json();

                    if (res.ok) {
                        document.getElementById('resetPasswordForm').style.display = 'none';
                        showSuccess((json.message || 'Password reset successfully!') + ' Redirecting to login...');
                        setTimeout(function () {
                            window.location.href = '/public/login.html';
                        }, 3000);
                    } else {
                        var errors = json.errors || {};
                        var firstField = Object.keys(errors)[0];
                        var msg = firstField ? errors[firstField] : (json.message || 'Something went wrong. Please try again.');
                        showError(msg + ' <a href="/public/forgot-password.html" class="link-text">Request a new link</a>');
                        btn.disabled  = false;
                        btn.innerHTML = origHTML;
                    }
                } catch (err) {
                    console.error('Reset password error:', err);
                    showError('An unexpected error occurred. Please try again.');
                    btn.disabled  = false;
                    btn.innerHTML = origHTML;
                }
            });

            // Clear error on input focus
            [pwInput, confirmInput].forEach(function (el) {
                el.addEventListener('focus', function () {
                    var errEl = document.getElementById('error-message');
                    if (errEl) errEl.style.display = 'none';
                });
            });
        });

        function showError(msg) {
            clearMessages();
            var d = document.getElementById('error-message');
            if (!d) {
                d = document.createElement('div');
                d.id = 'error-message';
                d.className = 'alert alert-error';
                var card = document.querySelector('.auth-card');
                var form = document.getElementById('resetPasswordForm');
                card.insertBefore(d, form);
            }
            d.innerHTML = '<i class="fas fa-exclamation-circle"></i><span>' + msg + '</span>';
            d.style.display = 'flex';
        }

        function showSuccess(msg) {
            clearMessages();
            var d = document.getElementById('success-message');
            if (!d) {
                d = document.createElement('div');
                d.id = 'success-message';
                d.className = 'alert alert-success';
                var card = document.querySelector('.auth-card');
                var form = document.getElementById('resetPasswordForm');
                card.insertBefore(d, form);
            }
            d.innerHTML = '<i class="fas fa-check-circle"></i><span>' + msg + '</span>';
            d.style.display = 'flex';
        }

        function clearMessages() {
            ['error-message', 'success-message'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }
    }());
    </script>
</body>
</html>
