<!DOCTYPE html>
<html lang="en">
<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VNN90D4GDE"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VNN90D4GDE');
    </script>
    <!-- Google ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6423925713865339"
    crossorigin="anonymous"></script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4B6EFB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Fluency">

    <!-- Manifest and Icons -->
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('Service Worker registered with scope:', registration.scope);
            })
            .catch(error => {
              console.error('Service Worker registration failed:', error);
            });
        });

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Fluency</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>

    <main>
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <i class="fas fa-key"></i>
                        <h2>Reset Password</h2>
                        <p>Enter your email to receive a password reset link</p>
                    </div>

                    <div class="info-message">
                        <i class="fas fa-info-circle"></i>
                        <p>We'll send you instructions to reset your password to your registered email address.</p>
                    </div>

                    <form class="auth-form" id="forgotPasswordForm">
                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i>
                                Email Address
                            </label>
                            <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                        </div>

                        <button type="submit" class="auth-btn" id="submitBtn">
                            <i class="fas fa-paper-plane"></i>
                            Send Reset Link
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p>Remember your password? <a href="/public/login.html" class="link-text">Login</a></p>
                        <p>Don't have an account? <a href="/public/signup.html" class="link-text">Sign up</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 AI Fluency Course</p>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="/privacy-policy.html">Privacy Policy</a>
                <a href="/terms-of-use.html">Terms of Use</a>
            </div>
        </div>
    </footer>

    <!-- Core scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-template.js"></script>
    <script src="../js/script.js"></script>

    <script>
    (function () {
        'use strict';

        const API_BASE = '/api';

        document.getElementById('forgotPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn      = document.getElementById('submitBtn');
            const origHTML = btn.innerHTML;
            const email    = document.getElementById('email').value.trim();

            clearMessages();

            if (!email) {
                showError('Please enter your email address.');
                return;
            }

            btn.disabled  = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            try {
                const formData = new FormData();
                formData.append('email', email);

                const res  = await fetch(`${API_BASE}/auth/forgot-password`, {
                    method: 'POST',
                    body: formData
                });
                const json = await res.json();

                if (res.ok) {
                    showSuccess(json.message || 'If an account with that email exists, a password reset link has been sent. Please check your inbox.');
                    // Disable form after success
                    document.getElementById('email').disabled = true;
                    btn.style.display = 'none';
                } else {
                    const errors = json.errors || {};
                    const firstField = Object.keys(errors)[0];
                    const msg = firstField ? errors[firstField] : (json.message || 'Something went wrong. Please try again.');
                    showError(msg);
                    btn.disabled  = false;
                    btn.innerHTML = origHTML;
                }
            } catch (err) {
                console.error('Forgot password error:', err);
                showError('An unexpected error occurred. Please try again.');
                btn.disabled  = false;
                btn.innerHTML = origHTML;
            }
        });

        function showError(msg) {
            clearMessages();
            let d = document.getElementById('error-message');
            if (!d) {
                d = document.createElement('div');
                d.id = 'error-message';
                d.className = 'alert alert-error';
                const form = document.getElementById('forgotPasswordForm');
                form.insertBefore(d, form.firstChild);
            }
            d.innerHTML = '<i class="fas fa-exclamation-circle"></i><span>' + msg + '</span>';
            d.style.display = 'flex';
            setTimeout(() => { d.style.display = 'none'; }, 6000);
        }

        function showSuccess(msg) {
            clearMessages();
            let d = document.getElementById('success-message');
            if (!d) {
                d = document.createElement('div');
                d.id = 'success-message';
                d.className = 'alert alert-success';
                const form = document.getElementById('forgotPasswordForm');
                form.insertBefore(d, form.firstChild);
            }
            d.innerHTML = '<i class="fas fa-check-circle"></i><span>' + msg + '</span>';
            d.style.display = 'flex';
        }

        function clearMessages() {
            ['error-message', 'success-message'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        // Clear error on input focus
        document.getElementById('email').addEventListener('focus', function () {
            const el = document.getElementById('error-message');
            if (el) el.style.display = 'none';
        });
    }());
    </script>
</body>
</html>
