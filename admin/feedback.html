<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VNN90D4GDE"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VNN90D4GDE');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback - Admin - AI Fluency</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../images/logo.svg" alt="Logo">
                <h2>AI Fluency</h2>
            </div>

            <div class="sidebar-profile">
                <div class="profile-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="profile-name">Admin User</div>
                <div class="profile-role">System Administrator</div>
            </div>

            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="/admin/instructors/teachers.html" class="nav-item">
                    <i class="fas fa-chalkboard-teacher"></i>
                    <span>Instructors</span>
                </a>
                <a href="/admin/students/learners.html" class="nav-item">
                    <i class="fas fa-user-graduate"></i>
                    <span>Students</span>
                </a>
                <a href="/admin/courses.html" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span>Courses</span>
                </a>
                <a href="/admin/modules.html" class="nav-item">
                    <i class="fas fa-layer-group"></i>
                    <span>Modules</span>
                </a>
                <a href="/admin/lessons.html" class="nav-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Lessons</span>
                </a>
                <a href="/admin/quizzes.html" class="nav-item">
                    <i class="fas fa-question-circle"></i>
                    <span>Quizzes</span>
                </a>
                <a href="/admin/projects.html" class="nav-item">
                    <i class="fas fa-project-diagram"></i>
                    <span>Projects</span>
                </a>
                <a href="/admin/analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
                <a href="/admin/feedback.html" class="nav-item active">
                    <i class="fas fa-comment-dots"></i>
                    <span>User Feedback</span>
                </a>
                <div class="nav-divider"></div>
                <a href="/student/courses.html" class="nav-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span>My Courses</span>
                </a>
                <a href="#" onclick="Auth.logout(); return false;" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-topbar">
                <div class="topbar-left">
                    <h1>User Feedback</h1>
                </div>
            </div>

            <div class="dashboard-content" id="dashboard-content">
                <!-- Status Tabs -->
                <div class="feedback-tabs" id="feedback-tabs">
                    <button class="feedback-tab active" data-status="">All <span class="tab-count" id="count-all">0</span></button>
                    <button class="feedback-tab" data-status="new">New <span class="tab-count" id="count-new">0</span></button>
                    <button class="feedback-tab" data-status="in_review">In Review <span class="tab-count" id="count-review">0</span></button>
                    <button class="feedback-tab" data-status="resolved">Resolved <span class="tab-count" id="count-resolved">0</span></button>
                    <button class="feedback-tab" data-status="dismissed">Dismissed <span class="tab-count" id="count-dismissed">0</span></button>
                </div>

                <!-- Feedback List -->
                <div class="feedback-list" id="feedback-list">
                    <div class="loading-spinner">Loading feedback...</div>
                </div>

                <!-- Pagination -->
                <div id="feedback-pagination" style="display:flex;justify-content:center;gap:0.5rem;margin-top:1.5rem;"></div>
            </div>
        </main>
    </div>

    <!-- Detail Overlay -->
    <div class="feedback-detail-overlay" id="feedback-detail-overlay">
        <div class="feedback-detail-panel" id="feedback-detail-panel">
            <!-- Populated by JS -->
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script>
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        if (hamburger) {
            hamburger.addEventListener('click', function() {
                sidebar.classList.toggle('mobile-open');
            });
        }
    </script>
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-template.js"></script>
    <script src="../js/admin-feedback.js"></script>
    <script>
        Auth.requireAuth(['superadmin', 'orgadmin']);
    </script>
</body>
</html>
